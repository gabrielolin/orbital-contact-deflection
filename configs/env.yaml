simulation:
  sim_dt: 0.001
  control_dt: 0.005
  policy_dt: 0.250
  initial_arm_q: [0.0, -1.570796327, 1.570796327, -1.570796327, 1.570796327, 0.0]
  sensor_dt: 0.01
  episode_duration: 2.0
  projectile_speed: 3.0
estimation:
  measurement_noise_std: 0.01
  acceleration_noise_std: 0.05
controller:
  kp: [35.0, 35.0, 30.0, 20.0, 15.0, 10.0]
  kd: [5.0, 5.0, 4.5, 3.0, 2.5, 2.0]
  torque_limits: [150.0, 150.0, 150.0, 28.0, 28.0, 28.0]
desired_velocity_goal:
  # Gaussian components in [incoming-opposing normal, tangent1, tangent2].
  normal_mean: 1.45
  normal_std: 0.25
  tangent_std: 0.40
  minimum_speed: 0.75
  maximum_speed: 2.50
terminal_reward:
  velocity_tolerance: 0.50
  miss_penalty: 1.0
  miss_distance_scale: 0.25
  huber_delta: 1.0
  angular_momentum_scale: 10.0
  angular_momentum_weight: 0.05
  follow_through_duration: 0.050
  stopping_duration: 0.100
  outgoing_velocity_average_duration: 0.040
episode_randomization:
  # MuJoCo solref compliance parameter, not projectile arrival time.
  contact_solver_time_constant_mean: 0.010
  contact_solver_time_constant_std: 0.0005
  contact_solver_time_constant_minimum: 0.0085
  contact_damping_ratio_mean: 0.100
  contact_damping_ratio_std: 0.005
  contact_damping_ratio_minimum: 0.080
  projectile_mass_mean: 1.50
  projectile_mass_std: 0.15
  projectile_mass_minimum: 0.25
  shield_mass_mean: 4.50
  shield_mass_std: 0.30
  shield_mass_minimum: 0.50
  # Initial projectile position in the initial shield frame. Its local +Z axis
  # points outward, so [0, 0, 3] starts the projectile 3 m in front.
  projectile_position_mean_shield: [0.0, 0.0, 3.0]
  projectile_position_std: [0.05, 0.05, 0.15]
  projectile_velocity_component_std: 0.10
  arm_position_std: 0.02
  spacecraft_linear_velocity_std: 0.005
  spacecraft_angular_velocity_std: 0.002
