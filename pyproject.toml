[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-deflection"
version = "0.1.0"
description = "Contact-aware projectile deflection with a free-floating manipulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.1,<2",
  "mujoco>=3.10,<4",
  "mink>=1.3,<2",
  "scipy>=1.12,<2",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "mypy>=1.13,<2"]
render = ["imageio>=2.36,<3", "imageio-ffmpeg>=0.5,<1"]
rl = [
  "stable-baselines3>=2.5,<3",
  "imageio>=2.36,<3",
  "imageio-ffmpeg>=0.5,<1",
  "tqdm>=4.66",
  "rich>=13",
]
tracking = ["wandb>=0.18", "tensorboard>=2.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["contact_deflection"]

[[tool.mypy.overrides]]
module = ["mujoco", "gymnasium.*", "scipy.*", "yaml"]
ignore_missing_imports = true
